services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  worker:
    build: ./worker
    environment:
      RABBIT_HOST: rabbitmq
      REDIS_HOST: redis
    depends_on:
      - rabbitmq
      - redis
    restart: unless-stopped

volumes:
  pgdata:
